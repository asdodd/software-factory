[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.0.1"
description = "Shared AI-driven pipeline from ai-ready tickets to human-reviewed merge requests."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
factory = "factory.cli.main:main"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = [
  "skills/*.toml", "skills/base/*.md",
  "agent_kit/AGENTS.md", "agent_kit/.claude/settings.json", "agent_kit/.claude/hooks/*.py",
  "agent_kit/.claude/skills/*/SKILL.md", "agent_kit/.clinerules/hooks/*",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9", "boto3==1.44.12"]
s3 = ["boto3==1.44.12"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "TID"]
ignore = ["SIM105", "SIM108", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"factory.adapters".msg = "core, ports, config and features must not import concrete adapters"

[tool.ruff.lint.per-file-ignores]
"factory/adapters/**" = ["TID251"]
"factory/testing/**" = ["TID251"]
"tests/**" = ["TID251"]
