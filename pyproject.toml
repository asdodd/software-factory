[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.0.1"
description = "Shared AI-driven pipeline from ai-ready tickets to human-reviewed merge requests."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
factory = "factory.cli.main:main"

[tool.setuptools.packages.find]
include = ["factory*"]
