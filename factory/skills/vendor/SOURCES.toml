# Third-party skills, vendored from the pinned commits below. Files listed under
# `modified` carry factory:if blocks (see factory/core/conditional.py) so their
# sub-agent and online passages can be switched by [capabilities]; each such file
# begins with a modification notice. Everything else is unchanged upstream text.

[mattpocock]
repo = "https://github.com/mattpocock/skills"
commit = "6f7f7831a625f040a8e06a0e7954826b87ce775a"
license = "MIT"
license_file = "mattpocock/LICENSE"
skills = ["tdd", "code-review", "codebase-design", "diagnosing-bugs", "pr", "retro", "to-spec",
          "improve-codebase-architecture"]
paths = "skills/engineering/<name>"
modified = ["code-review/SKILL.md", "codebase-design/SKILL.md", "codebase-design/DESIGN-IT-TWICE.md",
            "improve-codebase-architecture/SKILL.md"]
modification = "Sub-agent and online passages wrapped in factory:if blocks with single-session and offline alternatives."
moved = "software-factory moved to factory/skills/vendor-online (needs internet)"
excluded = "scripts/ directories (executable helpers are not vendored)"
notes = "pr/CREDITS.md credits Dex Horthy's show-me skill (humanlayer/humanlayer) for its Summary section."

[humanlayer-rpi]
repo = "https://github.com/humanlayer/humanlayer"
commit = "fb899cd8cba767f0392708efc20d00938dec6a87"
