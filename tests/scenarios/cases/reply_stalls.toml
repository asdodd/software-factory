name = "an unanswered question times out to stalled"
include = ["_common.toml", "_ticket.toml", "_paused.toml"]

[[steps]]
advance_hours = 73
[[steps]]
run = "frontend-bot"

[expect]
outcomes = ["needs_info", "stalled"]
[[expect.tickets]]
key = "SIM-1"
status = "In Progress"
paused = false
labels_include = ["ai-stalled", "ai-stalled"]
