name = "with sub-agents and internet allowed, the rules and skills say so and Claude's Task tool stays enabled"
include = ["_native.toml"]

[settings.capabilities]
subagents = true
internet = true

[settings.harnesses.claude.settings]
agent = "claude"
env = { EXPECT_RULES_FILE = ".claude/CLAUDE.md", EXPECT_RULES_TEXT = "Sub-agents are allowed but cost requests", EXPECT_RULES_NOT = "There is no internet access", EXPECT_SKILL = "tdd", EXPECT_SKILL_DIRS = ".claude/skills", EXPECT_SUBAGENT_FLAG_ABSENT = "1" }

[settings.models.stages.implement]
provider = "scripted"
model = "sim-large"
harness = "claude"

[expect]
outcomes = ["mr_opened"]
[expect.git]
mr_description_contains = ["ISOLATION-OK via claude"]
