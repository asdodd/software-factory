name = "Claude Code gets the skills installed in its sandbox home and a working-notes directory outside the repo"
include = ["_common.toml", "_secure_repo.toml", "_secure_ticket.toml"]
agent_files = ["agents/secure-bot.toml"]
process_env = { PATH = "{scenario_dir}/fixtures/bin:{PATH}" }

[settings.harnesses.claude.settings]
agent = "claude"
env = { EXPECT_SKILL = "tdd", EXPECT_SKILL_DIRS = ".claude/skills" }

[settings.models.stages.implement]
provider = "scripted"
model = "sim-large"
harness = "claude"

[[model]]
stage = "implement"
content = { path = "src/calc.py", content = "def add(a, b):\n    return a + b\n\n\ndef multiply(a, b):\n    return a * b\n" }

[[steps]]
run = "secure-bot"

[expect]
outcomes = ["mr_opened"]
[expect.git]
mr_description_contains = ["ISOLATION-OK via claude"]
