name = "a /followup comment on an MR creates a follow-up ticket and replies in the thread"
include = ["_common.toml", "_gitlab.toml"]

[[steps]]
gitlab_comment = { repo = "web/portal", author = "bob", body = "/followup Handle negative numbers in add\n- add(-1, -2) returns -3\n- covered by a test", target_kind = "merge_request", target_id = 7 }
[[steps]]
intake_poll = true

[expect]
ticket_count = 1
model_calls = { scripted = 0 }
[[expect.tickets]]
key = "SIM-1"
summary = "Handle negative numbers in add"
reporter = "bob"
labels_exclude = ["ai-ready"]
field_contains = { repo = "web/portal", acceptance_criteria = "- add(-1, -2) returns -3" }
comments_contain = ["proposed ready", "draft-only mode is on"]
[expect.git]
host_comments = 1
host_comments_contain = ["Created follow-up ticket SIM-1: sim://jira/browse/SIM-1"]
