name = "metrics: tool-call success rate from the tool results a CLI agent sends through the gateway"
include = ["_common.toml", "_ticket.toml"]

[settings.harnesses.fake-cli]
adapter = "harness.command"
[settings.harnesses.fake-cli.settings]
argv = ["python3", "{scenario_dir}/fixtures/fake_agent.py"]
env = { GATEWAY_URL = "{gateway_url}", GATEWAY_TOKEN = "{gateway_token}", MODEL = "{model}", INSTRUCTIONS = "{instructions_file}", RESULT = "{result_file}", DIALECT = "openai_chat", TOOL_HISTORY = "1" }

[settings.models.stages.implement]
provider = "scripted"
model = "sim-large"
harness = "fake-cli"

[[model]]
stage = "implement"
content = { path = "src/calc.py", content = "def add(a, b):\n    return a + b\n\n\ndef multiply(a, b):\n    return a * b\n" }

[[steps]]
run = "frontend-bot"
[[steps]]
metrics = true

[expect]
outcomes = ["mr_opened"]
[expect.feedback.metrics]
tool_call_success_rate = 0.667
