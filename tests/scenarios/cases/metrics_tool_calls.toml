name = "metrics: tool-call success rate from the builtin harness trace"
include = ["_common.toml", "_ticket.toml"]
[settings.models.stages.implement]
provider = "scripted"
model = "sim-large"
harness = "builtin"

[[model]]
stage = "implement"
tool_calls = [{ name = "read_file", arguments = { path = "src/calc.py" } }]
[[model]]
stage = "implement"
tool_calls = [{ name = "read_file", arguments = { path = "missing.py" } }]
[[model]]
stage = "implement"
tool_calls = [{ name = "write_file", arguments = { path = "src/calc.py", content = "def add(a, b):\n    return a + b\n\n\ndef multiply(a, b):\n    return a * b\n" } }]
[[model]]
stage = "implement"
tool_calls = [{ name = "finish", arguments = { status = "done", summary = "Added multiply." } }]

[[steps]]
run = "frontend-bot"
[[steps]]
metrics = true

[expect]
outcomes = ["mr_opened"]
[expect.feedback.metrics]
tool_call_success_rate = 0.667
