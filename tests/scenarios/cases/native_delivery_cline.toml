name = "cline gets the factory rules and skills its own way, with sub-agents and internet off"
include = ["_native.toml"]

[settings.harnesses.cline.settings]
agent = "cline"
env = { EXPECT_RULES_FILE = "Documents/Cline/Rules/software-factory.md", EXPECT_RULES_TEXT = "Do not spawn sub-agents", EXPECT_SKILL = "tdd", EXPECT_SKILL_DIRS = "", EXPECT_NO_SUBAGENT_FLAG = "1" }

[settings.models.stages.implement]
provider = "scripted"
model = "sim-large"
harness = "cline"

[expect]
outcomes = ["mr_opened"]
[expect.git]
mr_description_contains = ["ISOLATION-OK via cline"]
