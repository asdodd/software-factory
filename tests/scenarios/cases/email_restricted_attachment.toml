name = "restricted email attachments never reach the drafting model"
include = ["_common.toml", "_email.toml"]

[[steps]]
email = { from = "alice@sim.invalid", subject = "Bug", body = "See attachments.", thread = "t-1", attachments = [{ name = "proprietary-roadmap.txt", content = "TOPSECRET-ROADMAP" }, { name = "notes.txt", content = "PROPRIETARY\nTOPSECRET-NOTES" }, { name = "error.log", content = "ERROR in calc.add" }] }
[[steps]]
intake_poll = true

[expect]
ticket_count = 1
[expect.model_requests.scripted]
contain = ["ERROR in calc.add", "2 attachment(s) were withheld by policy."]
exclude = ["TOPSECRET", "proprietary-roadmap"]
