name = "replies are polled at the configured interval, not on every cycle"
include = ["_common.toml", "_ticket.toml", "_paused.toml", "_second_run_good.toml"]
[settings.jira_comments]
poll_interval_seconds = 600

[[steps]]
run = "frontend-bot"
[[steps]]
human_comment = { ticket = "SIM-1", author = "bob", body = "Yes, round to 2 decimals." }
[[steps]]
advance_minutes = 5
[[steps]]
run = "frontend-bot"
[[steps]]
advance_minutes = 6
[[steps]]
run = "frontend-bot"

[expect]
outcomes = ["needs_info", "mr_opened"]
