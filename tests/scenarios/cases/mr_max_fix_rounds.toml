name = "mr.max_fix_rounds is enforced"
include = ["_common.toml", "_ticket.toml", "_good_change.toml", "_mr_open.toml"]
[settings.mr]
max_fix_rounds = 1

[[model]]
stage = "respond"
content = { kind = "change_request", reply = "ok" }
repeat = true

[[harness]]
ticket = "SIM-1"
actions = [
  { write = "src/calc.py", content = "def add(a, b):\n    return a + b\n\n\ndef multiply(a, b):\n    return b * a\n" },
  { result = { status = "done", summary = "Swapped operands." } },
]

[[steps]]
mr_comment = { author = "bob", body = "Swap the operands.", thread = "t1" }
[[steps]]
mr_comment = { author = "bob", body = "Now rename it.", thread = "t2" }
[[steps]]
run = "frontend-bot"

[expect]
outcomes = ["mr_opened", "fix_pushed"]
[expect.git]
push_counts = { "ai/frontend-bot/SIM-1" = 2 }
mr_replies_contain = ["reached the limit of 1 fix rounds"]
