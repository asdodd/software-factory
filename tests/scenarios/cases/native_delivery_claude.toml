name = "claude gets the factory rules and skills its own way, with sub-agents and internet off"
include = ["_native.toml"]

[settings.harnesses.claude.settings]
agent = "claude"
env = { EXPECT_RULES_FILE = ".claude/CLAUDE.md", EXPECT_RULES_TEXT = "Do not spawn sub-agents", EXPECT_SKILL = "tdd", EXPECT_SKILL_DIRS = ".claude/skills", EXPECT_NO_SUBAGENT_FLAG = "1", EXPECT_LONG_TIMEOUT = "1" }

[settings.models.stages.implement]
provider = "scripted"
model = "sim-large"
harness = "claude"

[expect]
outcomes = ["mr_opened"]
[expect.git]
mr_description_contains = ["ISOLATION-OK via claude"]
