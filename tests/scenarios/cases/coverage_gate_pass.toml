name = "coverage on changed lines gate (pass)"
include = ["_ticket.toml", "_good_change.toml"]

[[repos]]
path = "web/portal"
rules = { coverage_report = "lcov.info", protected_paths = ["tools/**"], commands = { test = [["python3", "tools/write_lcov.py"]] } }
[repos.files]
"src/calc.py" = "def add(a, b):\n    return a + b\n"
"tools/write_lcov.py" = "lines = ['SF:src/calc.py', 'DA:1,1', 'DA:2,1', 'DA:5,1', 'DA:6,1', 'end_of_record']\nopen('lcov.info', 'w').write(chr(10).join(lines) + chr(10))\n"

[[model]]
stage = "triage"
content = { difficulty = "easy", reason = "small" }
repeat = true
[[model]]
stage = "review"
content = { summary = "ok" }
repeat = true

[[steps]]
run = "frontend-bot"

[expect]
outcomes = ["mr_opened"]
[expect.git]
mr_description_contains = ["coverage on changed lines 2/2 (100%)"]
mr_description_exclude = ["not measured"]
